      <section class="center"><div class="screen"><div class="screen-meta">HD · 60FPS<br>GPS 18 · 1080P</div><div class="hud"><i class="reticle"></i></div><button class="fullscreen" id="openSettings" aria-label="打开飞行设置"><svg class="mini-icon" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><div class="flight-actions" aria-label="图传操作"><button class="flight-action" aria-label="打开地图"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg><span>地图</span></button><button class="flight-action" aria-label="查看回放"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H7M4 4v5h5"/><path d="M10 9l5 3-5 3z"/></svg><span>回放</span></button><button class="flight-action" aria-label="拍照"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="4"/></svg><span>拍照</span></button><button class="flight-action" data-record aria-pressed="false" aria-label="开始录像"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg><span>录像</span></button><button class="flight-action" id="openSettingsBar" aria-label="打开飞行设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0015 6l-.3-2.6h-4L10.4 6A8 8 0 008.5 7L6 6.1 4 9.5 6.1 11a7 7 0 000 2L4 14.5l2 3.4 2.5-1A8 8 0 0010.4 18l.3 2.6h4L15 18a8 8 0 001.5-1l2.4 1 2-3.4-2-1.5a7 7 0 00.1-1z"/></svg><span>设置</span></button></div></div><div class="timer-list"><div class="timer"><span class="timer-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M9 3h6M12 6v3m0 4 3-2"/></svg>T1</span><time id="t1">00:03:21</time><button type="button" class="timer-settings" aria-label="设置计时器一"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0015 6l-.3-2.6h-4L10.4 6A8 8 0 008.5 7L6 6.1 4 9.5 6.1 11a7 7 0 000 2L4 14.5l2 3.4 2.5-1A8 8 0 0010.4 18l.3 2.6h4L15 18a8 8 0 001.5-1l2.4 1 2-3.4-2-1.5a7 7 0 00.1-1z"/></svg></button></div><div class="timer"><span class="timer-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M9 3h6M12 6v3m0 4 3-2"/></svg>T2</span><time id="t2">00:12:08</time><button type="button" class="timer-settings" aria-label="设置计时器二"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0015 6l-.3-2.6h-4L10.4 6A8 8 0 008.5 7L6 6.1 4 9.5 6.1 11a7 7 0 000 2L4 14.5l2 3.4 2.5-1A8 8 0 0010.4 18l.3 2.6h4L15 18a8 8 0 001.5-1l2.4 1 2-3.4-2-1.5a7 7 0 00.1-1z"/></svg></button></div></div></section>
      <div class="side right"><section class="gimbal" aria-label="右摇杆"><div class="grid"></div><i class="axis-x"></i><i class="axis-y"></i><button class="stick" aria-label="拖动右摇杆"></button><button class="trim trim-v" aria-label="右摇杆纵向微调"></button><button class="trim trim-h" aria-label="右摇杆横向微调"></button></section><section><div class="switch-panel" id="switches"></div><div class="dial-panel"><button class="dial" data-value="75" aria-label="调节 S1 油门量表" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75"><div class="arc"><svg viewBox="0 0 184 104" aria-hidden="true"><path class="arc-track" pathLength="100" d="M12 94 A80 80 0 0 1 172 94"/><path class="arc-value" pathLength="100" d="M172 94 A80 80 0 0 0 12 94"/></svg><span class="arc-copy"><strong>S1</strong><output>75%</output></span></div></button><button class="dial" data-value="75" aria-label="调节 S2 油门量表" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75"><div class="arc"><svg viewBox="0 0 184 104" aria-hidden="true"><path class="arc-track" pathLength="100" d="M12 94 A80 80 0 0 1 172 94"/><path class="arc-value" pathLength="100" d="M172 94 A80 80 0 0 0 12 94"/></svg><span class="arc-copy"><strong>S2</strong><output>75%</output></span></div></button></div></section></div>
    </section>
    <nav class="dock" aria-label="主导航"><a href="connect.html" aria-label="设备连接"><svg viewBox="0 0 24 24"><path d="M5 12h14M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></a><a href="models.html" aria-label="模型管理"><svg viewBox="0 0 24 24"><path d="M4 15l8-8 8 8M7 12v7h10v-7"/></svg></a><a class="active" href="home.html" aria-label="控制首页"><svg viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="11" rx="2"/><path d="M8 9V7a4 4 0 018 0v2"/></svg></a></nav>
  </main>
  <dialog id="settings"><div class="dialog-head"><h2>飞行设置</h2><button type="button" class="close" aria-label="关闭飞行设置">×</button></div><div class="dialog-body"><label>摇杆响应<input type="range" min="20" max="100" value="68"></label><p>当前为模式 2。所有控制输入会实时映射到 CH01–CH08。</p></div></dialog>
  <script>
    const leftZone=document.getElementById('channels');leftZone.className='control-zone';leftZone.setAttribute('aria-label','左手物理按键区');leftZone.innerHTML='<span class="control-zone-title">左手系统控制</span><div class="key-grid"><div class="five-way" aria-label="5D 五向键"><button class="hw-key up" data-key-id="d-up" aria-label="5D 上">↑</button><button class="hw-key left-key" data-key-id="d-left" aria-label="5D 左">←</button><button class="hw-key middle" data-key-id="d-middle" aria-label="5D 中">●</button><button class="hw-key right-key" data-key-id="d-right" aria-label="5D 右">→</button><button class="hw-key down" data-key-id="d-down" aria-label="5D 下">↓</button></div><div class="system-keys"><button class="hw-key danger-key" data-key-id="pause">暂停</button><button class="hw-key" data-key-id="auth-led">鉴权</button><button class="hw-key" data-key-id="power">电源</button><button class="hw-key" data-key-id="c1">C1</button></div></div>';
    const channels=document.getElementById('channels');channels.innerHTML=Array.from({length:8},(_,i)=>`<div class="channel"><span>CH${String(i+1).padStart(2,'0')}</span><span class="channel-track"><i style="--v:${i%2?'12%':'18%'};left:${i%2?'38%':'50%'}"></i></span><output>${i%2?'-12':'18'}%</output></div>`).join('');
    const switches=document.getElementById('switches');switches.innerHTML=['SA','SB','SC','SD','SE','SF'].map((x,i)=>`<button class="toggle" data-state="${i>3?1:0}" aria-pressed="${i>3}"><span class="slot"><i></i></span><span>${x}</span></button>`).join('');switches.addEventListener('click',e=>{const b=e.target.closest('.toggle');if(!b)return;const state=b.dataset.state==='1'?'0':'1';b.dataset.state=state;b.setAttribute('aria-pressed',state==='1')});
    document.querySelectorAll('.stick').forEach(stick=>{let active=false;const move=e=>{if(!active)return;const r=stick.parentElement.getBoundingClientRect();const x=Math.max(30,Math.min(r.width-30,e.clientX-r.left));const y=Math.max(30,Math.min(r.height-30,e.clientY-r.top));stick.style.left=x+'px';stick.style.top=y+'px'};stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',move);stick.addEventListener('pointerup',()=>active=false)});
    document.querySelectorAll('.dial').forEach(d=>{const setValue=v=>{v=Math.max(0,Math.min(100,v));d.dataset.value=v;d.style.setProperty('--value',v);d.setAttribute('aria-valuenow',v);d.querySelector('.arc-value').style.strokeDasharray=`${100-v} 100`;d.querySelector('output').textContent=v+'%'};setValue(Number(d.dataset.value));d.addEventListener('click',()=>setValue((Number(d.dataset.value)+5)%105));d.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowDown','ArrowRight','ArrowUp','Home','End'].includes(e.key))return;e.preventDefault();if(e.key==='Home')setValue(0);else if(e.key==='End')setValue(100);else setValue(Number(d.dataset.value)+(e.key==='ArrowRight'||e.key==='ArrowUp'?5:-5))})});
    const settings=document.getElementById('settings');const openSettings=()=>settings.showModal();document.getElementById('openSettings').addEventListener('click',openSettings);document.getElementById('openSettingsBar').addEventListener('click',openSettings);document.getElementById('openSettingsTop').addEventListener('click',openSettings);settings.querySelector('.close').addEventListener('click',()=>settings.close());settings.addEventListener('click',e=>{if(e.target===settings)settings.close()});
    document.querySelector('[data-record]').addEventListener('click',e=>{const b=e.currentTarget;const active=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',active?'停止录像':'开始录像');b.querySelector('span').textContent=active?'停止':'录像'});
    document.querySelectorAll('.timer-settings').forEach(b=>b.addEventListener('click',openSettings));
    switches.className='key-grid right-key-zone';switches.setAttribute('aria-label','右手快捷按键区');switches.innerHTML=['C2','C3','RTH','REC'].map((label,i)=>`<button class="hw-key ${label==='RTH'?'danger-key':''}" data-key-id="${['c2','c3','rth','record'][i]}">${label}</button>`).join('');
    document.querySelectorAll('.hw-key').forEach(key=>key.addEventListener('click',()=>{key.setAttribute('aria-pressed','true');window.setTimeout(()=>key.setAttribute('aria-pressed','false'),180)}));
  </script>
</body>
